<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eec373"/>
      <stop offset="50%" stop-color="#D4A24C"/>
      <stop offset="100%" stop-color="#b88328"/>
    </linearGradient>
  </defs>

  <!-- Circular Emerald Badge with Gold Border -->
  <circle cx="40" cy="40" r="28" fill="#0D3B2A" stroke="#D4A24C" stroke-width="2"/>
  
  <!-- 5-Point Star -->
  <polygon points="40 22 44.5 31.5 54.5 33 47.5 40 49 50 40 45 31 50 32.5 40 25.5 33 35.5 31.5"
           fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: NOVA INFOTECH -->
  <text x="82" y="42" font-family="Playfair Display, Georgia, serif" font-size="26" font-weight="700" fill="#072117" letter-spacing="0.5">
    NOVA <tspan fill="url(#goldGrad)" font-style="italic" font-weight="400">INFOTECH</tspan>
  </text>

  <!-- Tagline: CERTIFIED ENTERPRISE HARDWARE -->
  <text x="83" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#5A6B63" letter-spacing="2">
    CERTIFIED ENTERPRISE HARDWARE
  </text>
</svg>
